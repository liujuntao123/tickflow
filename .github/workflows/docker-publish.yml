name: Publish Docker Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不含 v（如 1.0.0）'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        shell: bash
        env:
          DISPATCH: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${DISPATCH:-${REF#v}}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest" >> "$GITHUB_STEP_SUMMARY"