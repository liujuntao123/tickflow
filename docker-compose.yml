name: tickflow

services:
  postgres:
    image: ${REGISTRY_PREFIX:-}postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tickflow}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # postgres:18+ 镜像要求单挂载点 /var/lib/postgresql（数据落在其子目录）
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickflow} -d ${POSTGRES_DB:-tickflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 12s
    networks: [tickflow]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tickflow}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-30m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-60}
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tickflow]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://server:3000
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tickflow]

networks:
  tickflow:
    driver: bridge